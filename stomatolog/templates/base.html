<script> 
    document.getElementById('map-link').addEventListener('click', function(event) 
        { event.preventDefault(); 
        
        const map = document.getElementById('map'); 
        
        if (map.style.display === 'none') { 
            map.style.display = 'block'; 
            } else { 
                map.style.display = 'none'; 
            } 
    }); 
</script>
