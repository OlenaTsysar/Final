{% extends "base.html" %}

{% load static %}

{% block main_content %}

<div class="questionAsk_container">
    <h2>Задать вопрос клинике</h2>

    {% if success %}
        <p>Ваш вопрос успешно отправлен!</p>
    {% endif %}

    <form class="questionAsk_form" method="post" action="{% url 'questionAsk_page' %}">
        {% csrf_token %}

        {{form.as_p}}

        

    </form>
    <button type="submit">Отправить</button>
</div>



{% endblock main_content %}
