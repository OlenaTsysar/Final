{% extends "base.html" %}

{% load static%}

{% include "includes/header.html" %}

{% block main_content %}
<div class="servise_container">
    <ul class="servise_list">
        {% for categ in category %}
            <li class="category">
                <div class="categ_item">
                    <p>{{categ.name}}</p>
                </div>

                <ul class="servise_list">
                    {% for serv in categ.service.all %}
                        <li class="serv_item">
                            <p>{{serv.description}}</p>
                        </li>
            
                    {% endfor %}
                </ul>
            </li>
        {% endfor %}

    </ul>
</div>

{% endblock main_content %}
