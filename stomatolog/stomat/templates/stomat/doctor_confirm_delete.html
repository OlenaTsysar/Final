{% extends 'base.html' %}

{% block main_content %}
<div class="delete_doctor_container">
  <h2>Удалить врача?</h2> 

  <p>Вы уверены, что хотите удалить врача {{ doc.name }}?</p>

  <form class="delete_doctor_form" method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'doctor_name_page' id=object.pk %}">Отмена</a>
  </form>
</div>
{% endblock main_content %}
