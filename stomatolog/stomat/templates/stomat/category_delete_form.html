{% extends 'base.html' %}

{% block main_content %}
<div class="delete_category_container">
  <h2>Удалить категорию?</h2> 

  <p>Вы уверены, что хотите удалить категорию {{ category.name }}?</p>

  <form class="delete_category_form" method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <button type="submit" class="btn btn-danger"><a href="{% url 'price_page' %}">Отмена</a></button>
  </form>
</div>
{% endblock main_content %}
