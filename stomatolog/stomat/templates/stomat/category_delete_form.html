{% extends 'base.html' %}

{% block main_content %}
<div class="delete_category_container">
  <h3>Удалить категорию?</h3> 

  <p>Вы уверены, что хотите удалить категорию {{ category.name }}?</p>

  <form class="delete_category_form" method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a class="delete_category_container_button" href="{% url 'price_page' %}">Отмена</a>
  </form>
</div>
{% endblock main_content %}
